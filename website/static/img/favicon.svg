<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true">
  <!-- Eight steps on a grid, four of them lit: the trig row the whole surface
       is built around. Colours are the product's own -- the cyan is the step
       accent, the ground is the surface background. -->
  <rect width="64" height="64" rx="12" fill="#14181d"/>
  <g>
    <rect x="8"  y="14" width="10" height="16" rx="2.5" fill="#35c3e8"/>
    <rect x="22" y="14" width="10" height="16" rx="2.5" fill="#28323c"/>
    <rect x="36" y="14" width="10" height="16" rx="2.5" fill="#35c3e8"/>
    <rect x="50" y="14" width="6"  height="16" rx="2.5" fill="#28323c"/>
    <rect x="8"  y="34" width="10" height="16" rx="2.5" fill="#28323c"/>
    <rect x="22" y="34" width="10" height="16" rx="2.5" fill="#35c3e8"/>
    <rect x="36" y="34" width="10" height="16" rx="2.5" fill="#28323c"/>
    <rect x="50" y="34" width="6"  height="16" rx="2.5" fill="#35c3e8"/>
  </g>
</svg>
